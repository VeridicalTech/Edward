name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (editable)
        run: python -m pip install -e .
      - name: Unit tests (full discovery)
        run: python -m unittest discover -s . -p "test_*.py" -q
      - name: FROZEN benchmark regression (100% / 0 FP)
        run: python benchmark.py
      - name: CLI demo gate
        run: edward demo --trials 2
      - name: Policy presets eval
        run: |
          edward eval --policy conservative --trials 10
          edward eval --policy balanced --trials 10
