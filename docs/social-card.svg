<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Fira Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace">
  <rect width="1280" height="640" fill="#0d1117"/>
  <!-- terminal window -->
  <rect x="48" y="40" width="1184" height="536" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <line x1="48" y1="96" x2="1232" y2="96" stroke="#30363d" stroke-width="2"/>
  <circle cx="86" cy="68" r="9" fill="#ff5f57"/>
  <circle cx="118" cy="68" r="9" fill="#febc2e"/>
  <circle cx="150" cy="68" r="9" fill="#28c840"/>
  <text x="640" y="76" font-size="22" fill="#8b949e" text-anchor="middle">edward — live session</text>
  <!-- wordmark -->
  <text x="100" y="204" font-size="108" font-weight="bold" fill="#e6edf3">Edward<tspan fill="#3fb950">_</tspan></text>
  <text x="104" y="272" font-size="32" fill="#8b949e">The supervisor for unattended coding agents</text>
  <!-- transcript -->
  <text x="100" y="336" font-size="25"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> edward wrap -- pi "fix flaky test"</tspan></text>
  <text x="100" y="384" font-size="25"><tspan fill="#d29922">[PASSIVE STALL]</tspan><tspan fill="#e6edf3"> loop signature across 3 turns · $2,183 in tokens</tspan></text>
  <text x="100" y="432" font-size="25"><tspan fill="#f85149" font-weight="bold">PAUSED</tspan><tspan fill="#8b949e"> — decision signed · receipt #18 · resume anytime</tspan></text>
  <text x="100" y="480" font-size="25"><tspan fill="#3fb950">$</tspan><tspan fill="#3fb950"> </tspan><tspan font-size="25" fill="#3fb950">▋</tspan></text>
  <!-- capability chips -->
  <g font-size="20">
    <rect x="100" y="512" width="262" height="40" rx="20" fill="none" stroke="#3fb950" stroke-width="1.5"/>
    <text x="231" y="538" fill="#3fb950" text-anchor="middle">deterministic rules</text>
    <rect x="382" y="512" width="196" height="40" rx="20" fill="none" stroke="#a371f7" stroke-width="1.5"/>
    <text x="480" y="538" fill="#a371f7" text-anchor="middle">local 4B scorer</text>
    <rect x="598" y="512" width="142" height="40" rx="20" fill="none" stroke="#d29922" stroke-width="1.5"/>
    <text x="669" y="538" fill="#d29922" text-anchor="middle">resumable</text>
  </g>
  <!-- footer -->
  <text x="640" y="616" font-size="24" fill="#8b949e" text-anchor="middle">github.com/VeridicalTech/Edward</text>
  <text x="1232" y="616" font-size="20" fill="#30363d" text-anchor="end">MIT · Python 3.11+ · 0 deps</text>
</svg>
